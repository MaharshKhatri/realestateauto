# Every entry was checked on a live web page on `verified_on`; `source` is the page read. Phones appear only
# where the source page shows them. `investor_evidence` is a short quote from the source page (null = the page
# says nothing about investors). Website claims are marketing: before you open a file, call and confirm the
# agency will insure an ASSIGNMENT and an A-B / B-C DOUBLE CLOSE with separate funds for each closing, and
# check the agency's NJ title license (NAIC lookup) and the attorney's standing. Edit freely; add your own picks
# under `preferred:` (title_agency / closing_attorney names exactly as listed, or new entries of the same shape).
