tax:
  # engine/finance.py reads this block. Sources: IRS 2026 Form 1040-ES; 2026 NJ-1040-ES instructions.
  reserve_rate: 0.28                     # operator's set-aside on net wholesale profit (a habit, not a tax computation)
  self_employment_rate: 0.153            # 12.4% social security + 2.9% Medicare
  se_net_earnings_factor: 0.9235
  social_security_wage_base_2026: 184500
  federal_threshold_usd: 1000            # estimated payments needed if you expect to owe >= $1,000
  nj_threshold_usd: 400                  # NJ: expect to owe more than $400
  federal_estimated_due_dates: ["2026-04-15", "2026-06-15", "2026-09-15", "2027-01-15"]
  nj_estimated_due_dates: ["2026-04-15", "2026-06-15", "2026-09-15", "2027-01-15"]
  notes:
    - "Federal: the Jan 15, 2027 payment is not required if the 2026 return is filed by Feb 1, 2027 and the balance is paid."
    - "NJ: the Jan 15, 2027 payment is not required if the 2026 NJ return is filed by Feb 15, 2027 and the balance is paid."
  sources:
    - https://www.irs.gov/pub/irs-pdf/f1040es.pdf
    - https://www.irs.gov/businesses/small-businesses-self-employed/self-employment-tax-social-security-and-medicare-taxes
    - https://nj.gov/treasury/taxation/pdf/current/1040esi.pdf
    - https://www.nj.gov/treasury/taxation/njit20.shtml
