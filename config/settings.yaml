# Master configuration for the NJ wholesaling engine.
# Personal overrides go in config/settings.local.yaml (git-ignored, same structure, only changed keys).
# Secrets (API keys, passwords) go in .env — never here.

operator:
  name: "Operator"
  company_name: "Your Company LLC"
  phone: ""
  email: ""
  mailing_address: ""                # postal address for e-mail footers (CAN-SPAM) and letter return address
  # One true sentence about you for partner outreach (engine/jv_partner_vault.py). Edit it in My Setup; every word
  # must be true for you (NJ Consumer Fraud Act: no misrepresentation).
  intro: "I'm a quantitative CS student at Rutgers running a live scraper across NJ sheriff sales, tax liens and 90+ day fixers."
  home_base: "Edison, NJ"
  has_car: false                    # 100% virtual: no driving, door-knocking or in-person inspections
  virtual_only: true
  timezone: "America/New_York"

compliance:
  licensed_real_estate: false        # unlicensed: no referral/finder fees (N.J.S.A. 45:15-3); equity-rescue = free referral
  nj_telemarketer_registration: ""   # Division of Consumer Affairs registration no. (N.J.S.A. 56:8-121) once filed
  wholesaler_disclosure: >-
    I'm a real estate investor, not a licensed agent, and I don't represent you. If we reach an agreement,
    I may buy the property myself or assign my contract to another investor, and your attorney reviews
    everything before it's binding.
  frfpa_min_pct_fmv: 0.82
  attorney_review_business_days: 3
  frfpa_cancellation_business_days: 10

contracts:
  earnest_money: 1000                # seller-side deposit, held in escrow by the title company/attorney
  inspection_business_days: 10       # due-diligence window after attorney review ends
  deposit_business_days: 3           # PSA: seller-side deposit due this many business days after attorney review
  closing_days: 30                   # target closing, calendar days after attorney review ends
  loi_valid_days: 5
  assignee_deposit: 5000             # non-refundable deposit from the end buyer on assignment
  jv_split_pct: 50                   # default JV fee split to the partner who brings the end buyer
  title_company: ""                  # name/address of the NJ title company or closing attorney you use

ai:
  # Optional Claude coaching note after calls (pip install -e ".[ai]" + ANTHROPIC_API_KEY or `ant auth login`).
  # Only the town, deal numbers, outcome and redacted notes are sent — never names, phones or street addresses.
  enabled: true
  model: "claude-opus-5-5"
  effort: "low"
  timeout_seconds: 60

outreach:
  # B2B listing-agent offers (engine/agent_outreach.py). SMTP is optional: set SMTP_USER / SMTP_APP_PASSWORD
  # (a Gmail app password) in .env; mailto:/copy work without it.
  daily_email_limit: 40              # COLD e-mails (openers, first offers, nudges) per rolling 24 hours, never bulk
                                     # (25 -> 40 on 2026-11-03: 8 replies from the first 25; go to 60 only after two weeks
                                     # with bounces under 2% and nothing marked spam)
  reply_daily_limit: 150             # all e-mails incl. answers to agents who wrote back (Gmail allows ~500/day)
  smtp_host: "smtp.gmail.com"
  smtp_port: 465
  smtp_retry_waits: [5, 20]          # Gmail hung up / said "try again later": wait, try again (the Sent folder is
                                     # checked first when the line dropped mid-message, so an offer never goes twice)
  max_offer_basis: mao_70            # "best" structure in the e-mail: mao_70 (walk-away) or mao_75 (ceiling)
  # Offers far below ask get ignored (learned 2026-11-03: openings averaged 50% of ask across 1,149 stale listings).
  min_list_to_mao_75: 0.80           # contact a listing only when our walk-away reaches 80% of its ask
  min_open_pct_of_ask: 0.75          # the first number is at least 75% of ask (never above our target)
  ask_first_min_reach: 0.65          # 65-80%: no number from us; ask what the seller needs (engine/offer_math.py)
  fast_close_days: 21
  standard_close_days: 45

gmail_autopilot:
  # Phase 8 (engine/gmail_autopilot.py): the Gmail address + app password from My Setup read agent replies over IMAP
  # (INBOX opened read-only, BODY.PEEK: nothing is marked read) and send through smtp.gmail.com.
  enabled: true
  imap_host: "imap.gmail.com"
  imap_port: 993
  mailbox: "INBOX"
  poll_minutes: 5                    # background inbox check while the dashboard runs (and the 📥 button)
  lookback_days: 14                  # the first check reads this far back; later checks only read new messages
  auto_send_touch2: true             # "still available" + nothing else -> the priced offer + LOI go out by themselves
  auto_send_fact_check: true         # ... or, when the price needs one fact first (condo unit, unit count, wrong parcel),
                                     # a no-price answer asking for it (no number, no LOI)
  touch2_delay_minutes: [2, 5]       # ... a few minutes after the reply, like a person answering (the desk reads
                                     # the inbox every ~6 minutes, so a "still available" is answered within ~10)
  pace_seconds: [20, 45]             # the 🚀 batch: random gap between e-mails (never a burst)
  agent_cold_gap_hours: 72           # one NEW cold e-mail per agent address per 3 days (agents with many listings)
  reply_pace_seconds: [8, 20]        # offers to agents who replied, sent in one inbox run: a short gap between them
  send_hours: [8, 20]                # Eastern: the batch and automatic offers go out only in working hours
  max_body_chars: 4000               # the agent's own words kept per reply (quoted thread stripped)

autopilot:
  daily_goal: 30                     # distinct deals contacted per day (the progress bar)
  deck_size: 60
  max_followups_per_deck: 25         # due 48-hour nudges that reach one deck
  max_foreclosures_per_deck: 12      # listed foreclosures at the top of the deck
  first_touch: opener                # opener = the 2-sentence availability question first (Touch 1), then the
                                     # priced offer when the agent replies (Touch 2); offer = priced note first
  urgent_days_to_sale: 14            # listed foreclosures this close to the auction skip the opener
  partners_needed: 3                 # Phase 0: active funding partners with proof of funds before the deals start

calendar:                            # Google Calendar sync (engine/gcal_sync.py; `manage.py setup-calendar` once)
  enabled: true                      # syncs only once config/token.json exists
  mode: firm                         # 2026-11-09: 📊 firm status + deadlines + <= 5 warm actions only ("" = the old
                                     # follow-up / call-back / reply / sheriff-sale / call-block events)
  calendar_id: primary
  timezone: America/New_York
  dashboard_url: "http://127.0.0.1:8000"   # event links open the lead card here (/leads/<id>)
  followup_hours: 48                 # agent follow-up = this long after the e-mail, moved into 8am-9pm, Mon-Sat
  followup_minutes: 15               # event length
  attorney_review_time: "17:00"      # the 3rd NJ business day
  milestone_time: "09:00"            # other contract-to-close deadlines
  daily_goal_time: "10:00"
  daily_goal_rrule: "RRULE:FREQ=DAILY"
  reconnect_reminder_days: 6         # an OAuth app left in "Testing" loses its sign-in after 7 days: 🔑 reminder the
                                     # day before (0 = off, e.g. once the app is published)
  sheriff_sale_limit: 25             # priority sheriff sales on the calendar (listed foreclosures first)
  background_minutes: 10             # the cockpit re-syncs this often (retries anything queued while offline)
  colors:                            # Google colorId: 5 banana, 6 tangerine, 7 peacock, 9 blueberry, 10 basil, 11 tomato
    followup: "6"
    callblock: "10"                  # basil: the day's four call blocks
    callback: "7"
    attorney_review: "5"
    milestone: "9"
    sheriff_sale: "11"
    daily_goal: "10"
    reconnect: "3"                   # grape
    reply: "2"                       # sage: an agent answered, the deal waits on your click
    desk: "8"                        # graphite: the daily 📊 deal-desk status (all day, shows as free)
    done: "8"                        # graphite: ✅ a call or block you finished (or that needs nothing more)
    catchup: "6"                     # tangerine: 📞 catch-up calls a passed block didn't reach
    actions: "9"                     # blueberry: ✅ today's ten (replies, call-backs, flipper pitches)

call_sheet:
  # engine/call_sheet.py: up to crm.call_queue_size listing-agent calls a weekday in four blocks (one on Saturday),
  # frozen each morning so a code like A07 means the same call all day; reported in the chat as "A07 vm".
  blocks: [["A", "09:30"], ["B", "11:00"], ["C", "13:30"], ["D", "16:00"]]
  block_minutes: 75
  per_block: 25
  max_attempts: 4                    # follow-up calls with no conversation before a lead leaves the sheet
  recall_gap_days: 2                 # a new lead isn't called again within 2 days of the last touch
  firm_up_daily: 30                  # near-firm listings re-valued live with recent sold comps each morning

crm:
  # Days until the next touch, by call outcome (business-hours follow-up queue).
  followup_days:
    NO_ANSWER: 1                     # 100 calls a day: retry a no-answer the next business day
    LEFT_VM: 2
    WRONG_NUMBER: 0
    SPOKE_WARM_FOLLOWUP: 4
    SPOKE_NEEDS_OFFER: 1
    SPOKE_NOT_INTERESTED: 45
    AGENT_WILL_PRESENT_LOI: 2
    OFFER_SENT_TO_AGENT: 2           # 48-hour follow-up call to the listing agent's phone
    OFFER_ACCEPTED: 1
  max_attempts_no_contact: 8         # after this many no-answer/VM touches, park the lead (letter / agent / relative instead)
  sale_countdown_days: 21            # dashboard countdown window for sheriff sales
  call_queue_size: 100              # the daily call sheet (engine/call_sheet.py): up to 100 dials

markets:
  # Priority order. Names match CivilView / NJGIN county names.
  counties: [Middlesex, Union, Essex, Hudson, Passaic, Bergen, Camden, Mercer, Monmouth]
  # Focus municipalities for absentee/high-equity harvesting (NJGIN MUN_NAME values).
  # The self-improvement agent proposes additions in logs/swarm_intelligence.md.
  focus_municipalities:
    - {county: MIDDLESEX, name: WOODBRIDGE TWP}
    - {county: MIDDLESEX, name: EDISON TWP}
    - {county: MIDDLESEX, name: NEW BRUNSWICK CITY}
    - {county: MIDDLESEX, name: PERTH AMBOY CITY}
    - {county: UNION, name: ELIZABETH CITY}
    - {county: UNION, name: PLAINFIELD CITY}
    - {county: UNION, name: LINDEN CITY}
    - {county: ESSEX, name: NEWARK CITY}
    - {county: ESSEX, name: IRVINGTON TWP}
    - {county: ESSEX, name: EAST ORANGE CITY}
    - {county: HUDSON, name: JERSEY CITY}
    - {county: HUDSON, name: BAYONNE CITY}
    - {county: PASSAIC, name: PATERSON CITY}
    - {county: PASSAIC, name: PASSAIC CITY}
    - {county: BERGEN, name: HACKENSACK CITY}
    - {county: BERGEN, name: GARFIELD CITY}
    - {county: CAMDEN, name: CAMDEN CITY}
    - {county: CAMDEN, name: PENNSAUKEN TWP}
    - {county: MERCER, name: TRENTON CITY}
    - {county: MERCER, name: HAMILTON TWP}
    - {county: MERCER, name: EWING TWP}
    - {county: MONMOUTH, name: ASBURY PARK CITY}
    - {county: MONMOUTH, name: NEPTUNE TWP}
    - {county: MONMOUTH, name: LONG BRANCH CITY}
    - {county: MONMOUTH, name: FREEHOLD BORO}
  arv_sweet_spot: {min: 150000, max: 650000}

stale_listings:
  # agents/scrapers/stale_listing_distress_agent.py (homeharvest / Realtor.com: low volume, cached, 2 s between calls).
  min_days_on_market: 60             # stale = this many days on market (price cuts qualify at 45, distress words always)
  max_list_price: 900000
  deactivate_after_missed_harvests: 3   # a listing missing from its ZIP's last 3 successful harvests is off the market
                                        # (pending / contingent / sold drop out at once)
  blocked_cooldown_hours: 12         # after a refusal (403): stop, keep what was harvested, ask nothing for this long
  include_auto_expansion: true       # also harvest the ZIPs of towns in swarm_state.auto_expansion (from our parcels)
  auto_expansion_min_parcels: 5      # ... a ZIP counts when it holds 5+ of that town's parcels
  auto_expansion_min_share: 0.10     # ... and 10%+ of them
  auto_expansion_max_zips: 4
  zips:                              # quote every ZIP (an unquoted 07012 would read as a number)
    # Middlesex: Woodbridge Twp sections, Edison, New Brunswick, Perth Amboy
    ["07095", "07001", "07067", "08830", "08863", "07064", "08817", "08820", "08837", "08901", "08861",
    # Union: Elizabeth, Plainfield, Linden
     "07201", "07202", "07206", "07208", "07060", "07062", "07063", "07036",
    # Essex: Newark, Irvington, East Orange
     "07102", "07103", "07104", "07105", "07106", "07107", "07108", "07112", "07114", "07111", "07017", "07018",
    # Hudson: Jersey City, Bayonne
     "07302", "07304", "07305", "07306", "07307", "07002",
    # Passaic: Paterson, Passaic
     "07501", "07502", "07503", "07504", "07505", "07513", "07514", "07522", "07524", "07055",
    # Bergen: Hackensack, Garfield
     "07601", "07026",
    # Camden: Camden, Pennsauken
     "08102", "08103", "08104", "08105", "08109", "08110",
    # Mercer: Trenton, Hamilton, Ewing
     "08608", "08609", "08610", "08611", "08618", "08619", "08620", "08628", "08629", "08638", "08690", "08691",
    # Monmouth: Asbury Park, Neptune, Long Branch, Freehold
     "07712", "07753", "07740", "07728",
    # Added 2026-11-03: ZIPs holding most of our foreclosure / estate / vacant signals outside the list above.
    # Camden: Sicklerville, Gloucester City, Lindenwold / Clementon, Cherry Hill, Voorhees, Bellmawr
     "08081", "08030", "08021", "08003", "08043", "08034", "08031",
    # Passaic: Wayne, Clifton
     "07470", "07011",
    # Middlesex: Piscataway, East Brunswick, Carteret, North Brunswick, Old Bridge (+ Matawan / Aberdeen, Monmouth)
     "08854", "08816", "07008", "08902", "07747", "08857",
    # Union: Hillside, Rahway, Union, Roselle
     "07205", "07065", "07083", "07203",
    # Essex: Bloomfield, West Orange, Belleville, Orange
     "07003", "07052", "07109", "07050",
    # Bergen: Teaneck, Cliffside Park, Englewood, Lyndhurst, Elmwood Park
     "07666", "07010", "07631", "07071", "07407",
    # Hudson: Union City, West New York
     "07087", "07093",
    # Monmouth: Middletown, Howell, Keansburg
     "07748", "07731", "07734"]

underwrite:
  new_listing_cap: 300               # value_new_listings: listing leads with no valuation, valued per run
  new_listing_max_minutes: 20        # time budget per run (~13 s per valuation, measured 2026-11-03); the rest wait for
                                     # the next run (0 = none); the nightly daemon run gets 120 (agents.schedule_options)
  new_listing_retry_days: 3          # a listing whose comps came back empty is tried again after this many days

harvest:
  absentee_min_years_owned: 10       # "high equity" proxy: owned 10+ years
  old_stock_year_built_max: 1980
  max_parcels_per_municipality: 250  # cap per run so a run stays polite and fast
  out_of_state_priority: [FL, NY, PA, NC, CA, GA, SC, TX, VA, MD, AZ, DE, CT]

firm:
  # engine/offer_math.py: a price goes out only when every certainty check passes.
  max_comp_age_months: 12            # median comparable sale at most this old (MOD-IV lags; prices are time-adjusted)
  max_arv_to_ask: 1.30               # a fixed-up value above 1.3x a live ask is not certain enough for a final number...
  max_arv_to_ask_fixer: 1.50         # ...unless the listing reads as a fixer (as is, needs work, TLC, estate)

deal:
  pricing_model: quant               # quant = engine/quant_pricing.py buyer-implied solve (alpha + 15% ROI / $45K);
                                     # fixed_pct = the classic 70% / 75% rule below
  striking_distance_pct: 0.80        # listed leads: our ceiling must reach this share of the ask to be called
  striking_distance_report_pct: 0.78 # the stricter share reported by `manage.py recalibrate`
  mao_pct_conservative: 0.70         # fixed_pct model (and the FRFPA / fallback math)
  mao_pct_aggressive: 0.75
  anchor_discount_pct: 0.0           # opening offer = target (2026-11-03: one firm number, no lowball anchor)
  min_assignment_fee: 10000
  target_assignment_fee_min: 15000
  target_assignment_fee_max: 35000
  assignment_fee_pct_of_spread: 0.40 # share of the post-MAO spread we try to keep as fee
  comp_radius_miles: 0.5
  comp_radius_fallback_miles: 1.0
  comp_sold_days: 180
  comp_sqft_tolerance: 0.25
  min_comps: 3
  renovated_percentile: 0.70         # top 30% $/sqft -> ARV
  distressed_percentile: 0.30        # bottom 30% $/sqft -> as-is
  public_record_comp_months: 24      # NJGIN MOD-IV fallback comps (sale data lags ~1 year)
  annual_appreciation: 0.05          # time-adjusts older public-record comps
  high_tax_drag_threshold: 0.025     # effective tax rate (annual taxes / ARV) above this hurts buyer demand
  tax_drag_arv_haircut_per_pct: 0.02 # ARV haircut per 1 pt of effective tax rate above threshold
  outlier_guard:                     # engine/comps.py CompHygiene + engine/underwriter.py outlier_guard()
    comp_min_price: 40000            # below: non-arm's-length (family, $1 deeds)
    comp_max_price: 2500000          # above: package / commercial deed on a house parcel ...
    high_value_subject: 1200000      # ... unless the subject's equalized value or ask is above this
    comp_ppsf_min: 60                # NJ class 2 $/sqft sanity band (when living area is known)
    comp_ppsf_max: 850
    comp_ratio_min: 0.5              # comp sale / its equalized assessment (above ~2x: new construction
    comp_ratio_max: 2.0              # on a teardown lot, not a fixer comp)
    residential_classes: ["2"]
    max_arv_to_ask: 1.6              # ARV above 1.6x a live ask -> capped to benchmark_multiple x ask
    max_arv_to_equalized: 3.5        # ARV above 3.5x equalized assessment -> capped to benchmark_multiple x it
    benchmark_multiple: 1.25
    max_arv_per_sqft: 850
    confidence_cap: 40               # capped valuations are screening guesses
    non_residential_confidence_cap: 20

rehab:
  # 2025-2026 NJ figures (2026-11-03 research): cosmetic $22-38, mid $45-65 (kitchen + baths + floors), gut $85-140.
  light_per_sqft: 30
  medium_per_sqft: 55
  heavy_per_sqft: 110
  heavy_roof_hvac_buffer: 15000
  extra_contingency: {LIGHT: 0.0, MEDIUM: 0.05, HEAVY: 0.10}   # on top of the end buyer's 10%: 10% / 15% / 20% in all
  age_bumps:                          # extra $/sqft by build year (older NJ stock: knob & tube, lead, oil tanks)
    - {before: 1940, add_per_sqft: 10}
    - {before: 1960, add_per_sqft: 6}
    - {before: 1980, add_per_sqft: 3}
  default_sqft_per_unit: 1400         # when sqft is unknown

scoring:
  # Initial motivation weights (points). The self-improvement agent tunes these within bounds
  # and stores versions in the scoring_weights table.
  motivation:
    sheriff_sale_scheduled: 45
    sale_within_30_days: 15
    sale_within_60_days: 8
    adjourned_sale: 6
    lis_pendens: 30
    tax_delinquent: 25
    tax_sale_certificate: 35
    probate_estate: 30
    code_violation: 15
    vacant: 20
    absentee: 12
    out_of_state: 10
    long_tenure: 10
    old_stock: 5
    stale_listing: 18
    price_drops: 8
    distress_keywords: 12
    corporate_owner: -5
    stack_2x: 12                     # distinct distress families on one property (foreclosure, listing, absentee,
    stack_3x: 18                     # tax, estate, vacant, code, portfolio) — stacked distress converts best
    stack_4x: 25
    portfolio_owner: 10              # owner/mailing holds 2+ distressed or absentee leads: one call, several houses
    inbound_inquiry: 45              # the owner asked us for an offer through the website (engine/inbound.py)
  listing_striking_distance: {viability: 15, viability_close: 22, priority: 8}   # mao_75 >= 75% / 90% of ask + agent
  priority_mix: {motivation: 0.55, viability: 0.45}

scrapers:
  contact_email: ""            # included in the User-Agent so record custodians can reach you
  min_interval_seconds: 1.5    # per-host politeness delay
  cache_ttl_hours: 12
  timeout_seconds: 45
  max_retries: 3

agents:
  # cron: minute hour day month day_of_week (America/New_York)
  schedules:
    sheriff_sales: "30 5 * * *"
    lis_pendens: "40 5 * * 1-5"
    tax_assessment: "0 4 * * 1"
    cash_buyers: "0 4 * * 2"
    stale_listings: "0 6 * * *"
    tax_sales: "0 5 * * 3"
    owner_enrichment: "30 6 * * *"
    municipal_owners: "35 6 * * 1"
    listing_agents: "40 6 * * *"
    owner_resolver: "50 6 * * *"
    signal_stacker: "55 6 * * *"
    lead_scoring: "0 7 * * *"
    underwriter: "15 7 * * *"
    value_new_listings: "10 2 * * *"     # nightly: every listing lead still without a valuation (also in run-all)
  schedule_options:                      # options for a scheduled run only (run-all and the dashboard keep the defaults)
    value_new_listings: {max_minutes: 120}   # the long nightly run: up to new_listing_cap (300) at ~13 s each
    outlier_guard: "25 7 * * *"
    fast_track: "30 7 * * *"
    closing_alerts: "0 8 * * 1-5"
    calendar_sync: "*/15 * * * *"        # pushes anything queued while offline, pulls moved / deleted events
    gmail_replies: "*/5 * * * *"         # agent replies (the dashboard also checks every 5 minutes while it runs)
    buyer_matcher: "35 7 * * *"
    self_improvement: "45 7 * * *"

research_firm:
  # The 10-stream research firm (engine/swarm_firm.py, engine/firm_outbox.py, engine/streams/). Flat-fee research
  # products only: no referral fees, no pay tied to a deal or a client (N.J.S.A. 45:15-3; NJ RPC 7.2(c)).
  budget_seconds: 150                # stream time per desk run (the rest waits ~6 minutes for the next run)
  per_run: 6                         # e-mails the outbox sends per desk run, 8-20 s apart (cold ones: at most one, below)
  pace_seconds: [8, 20]
  business_hours: [8, 20]            # cold first touches: weekdays 8 AM-8 PM Eastern (operator, 2026-11-10); replies:
                                     # outreach.send_hours
  professional_last_hour: 18         # attorneys / CPAs / cost-seg / 1031: no cold mail after 6 PM or Friday afternoon
  cold_gap_minutes: [8, 15]          # one cold touch every 8-15 minutes (random), spread across the day
  caps: {p1: 150, p2: 12, p3: 18, nudges: 20}
                                     # rolling 24 h: replies + released samples / deal-desk first touches / specialty
                                     # first touches / in-thread nudges + close-the-loop notes. 30 B2B first touches a day
                                     # at full ramp (operator, 2026-11-10: stay on the personal Gmail at $0 with 2-sentence
                                     # plain-text openers, no attachments on Touch 1); with the 15 listing-agent openers
                                     # that is ~45 cold first touches a day.
  ramp: [20, 30]                     # first touches a day by week since the first B2B pitch (2026-11-09): 20 this week,
                                     # 30 from week 2 (engine/cold_guard.py); [] = the caps from day 1
  bounce_pause_count: 3              # 3+ bounces in 48 h pause every cold e-mail until they age out
  bounce_pause_rate: 0.02            # or > 2% of the last 7 days' cold sends (50+ sent)
  block_pause_days: 7                # Gmail 5.7.1 unsolicited / 4.7.28 / 5.7.28 / 5.4.5: no cold mail for 7 days
  ad_line: "A business solicitation from {who}."   # the cold footer line (CAN-SPAM 7704(a)(5)(A)(i), the statute's own
                                     # word); never "Ad:" in the subject; dropped after a yes (affirmative consent)
  sales_tax_line: true               # every price says "plus NJ sales tax" (N.J.S.A. 54:32B-3(b)(12), ANJ-29)
  sample_hold_days: 30               # a held Touch-2 sample nobody asked for expires after this many days
  payment_link: ""                   # the operator's payment link (Stripe Payment Link / PayPal / Square); when set, a
                                     # "start" reply gets it in their thread by itself. Per-product links go in
  payment_links: {}                  # payment_links: {s3: "https://...", s4: "https://..."}. Paying / trial clients
                                     # (a sealed note sets the target TRIAL / PAYING) get the full weekly report by itself.
  pitch_gap_days: 6                  # a new Touch 1 to the same target never within this many days
  max_touches: 3                     # one sequence: Touch 1, a nudge in-thread after nudge_days, close-the-loop after
  nudge_days: 3                      # close_days more (day 9-10); a reply, opt-out or bounce ends it
  close_days: 6
  rest_days: 60                      # after a finished sequence with no reply, a new Touch 1 (fresh data) at most every
                                     # 60 days; 0 = never
