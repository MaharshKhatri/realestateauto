# OPRA (N.J.S.A. 47:1A-1 et seq.) channels for the municipal clerks of our top towns, read on each town's own pages on
# 2026-10-28 (source URL per entry). engine/opra_generator.py drafts the request; the operator sends it.
#
# channel: email   - e-mail the custodian (a letter or e-mail with every item on the adopted form is a valid
#                    request, N.J.S.A. 47:1A-5(f))
#          portal  - the town takes requests only (or preferably) through its portal: paste the generated text
#          verify  - no verified e-mail / portal: call the clerk, then send the generated letter
# Never use OPRAmachine for these: it publishes requests and responses (owner names / addresses) publicly.
# Re-check entries every January; clerks change addresses and vendors.

rules:
  statute: "https://pub.njleg.state.nj.us/Bills/2024/PL24/16_.HTM"     # P.L.2024, c.16, in force Sept 3, 2024
  grc_form: "https://www.nj.gov/grc/custodians/request/index.html"
  grc_non_form_letter: "https://nj.gov/grc/public/faqs/OPRA%20Request%20Valid%20Non-Form%20Request%20(Oct%202024).pdf"
  commercial_business_days: 14       # 47:1A-5(i)(1): commercial requests (notice of the extension within 7)
  standard_business_days: 7
  penalty: "Intentionally failing to certify a commercial purpose: $1,000 / $2,500 / $5,000 civil penalty (47:1A-11(b))."
  precedents:
    - {case: "Hall v. City of Camden, GRC 2013-305", url: "https://www.nj.gov/grc/decisions/pdf/2013-305.pdf",
       holding: "the tax collector's Tax Search Export file must be disclosed"}
    - {case: "McBride v. City of Camden, GRC 2014-54", url: "https://www.nj.gov/grc/decisions/pdf/2014-54.pdf",
       holding: "a request for the TSE file is sufficiently specific; the custodian shall e-mail a copy"}
    - {case: "Wolosky v. Borough of Washington, GRC 2016-19", url: "https://www.nj.gov/grc/decisions/pdf/2016-19.pdf",
       holding: "the final tax sale list, bidder sheets and certificates were disclosed"}
    - {case: "O'Reilly v. Lawnside, GRC 2021-173", url: "https://www.nj.gov/grc/decisions/pdf/2021-173.pdf",
       holding: "a special service charge can be large: ask for the fee before any work over $5"}

