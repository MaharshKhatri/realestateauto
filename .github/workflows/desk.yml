# The deal desk in the cloud (engine/cloud_desk.py): replies, answers, openers, calendar, nightly backup.
# Runs every 15 minutes on GitHub's servers, so the operator's laptop can be closed. It stays off until the
# repository has three secrets (Settings > Secrets and variables > Actions): SMTP_USER, SMTP_APP_PASSWORD, DESK_KEY.
# The repository is public: the run prints counts only, and the state it keeps between runs is encrypted.
name: Deal desk

# Runs only by dispatch: each run starts the next one a few minutes later (the last step), 7 AM-9 PM Eastern, so the
# inbox is read about every 6 minutes. After 9 PM the last run hands over to night.yml, which waits and starts the
# 5:17 AM refresh; the refresh hands over again to start the day at 7:00. GitHub's own cron fired only a few times a
# day here (kicker.yml: none in its first 95 minutes), so nothing depends on it; kicker.yml stays as an extra net.
# Never dispatch two runs back to back: a second queued run replaces (cancels) the first in this concurrency group.
on:
  workflow_dispatch:
    inputs:
      task:
        description: "run | refresh | recalibrate | sheet (rebuild the blocks nobody called yet) | firmup (live re-value of today's call-sheet houses) | stats (pipeline counts) | value (price unvalued listings) | digest (weekly deal digests for flippers, mailed to you) | agents (flipper-connected agents report only) | firm (10-stream status counts) | firm-run (run every stream now) | approve | dismiss | offer | note"
        default: run
      reply:
        description: "with approve / dismiss: the reply #"
        default: ""
      lead:
        description: "with offer: the lead # whose offer e-mail goes out now"
        default: ""
      note:
        description: "with note: a sealed note from a Claude chat (ciphertext only)"
        default: ""

permissions:
  contents: read
  actions: write                # the last step dispatches the next run (workflow_dispatch works with GITHUB_TOKEN)

concurrency:
  group: deal-desk              # one run at a time: they share one database
  cancel-in-progress: false

jobs:
  desk:
    if: github.repository == 'MaharshKhatri/realestateauto'
    runs-on: ubuntu-latest
    timeout-minutes: 100           # the 5:17 AM refresh may take 80 minutes; a normal run takes 1-2
    env:
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
      DESK_KEY: ${{ secrets.DESK_KEY }}
      TZ: America/New_York
      DAILY_OPENERS: "15"          # 2026-11-10: back on for the 15 highest-margin convertible listings a day (2-line
                                   # availability openers, no attachment) per weekday, shared by the waves below
                                   # (cap: outreach.daily_email_limit); "0" pauses them
      CALL_SHEET: "off"            # PAUSED 2026-11-09: no daily call sheet / call blocks ("on" restores them)
      FIRM: "on"                   # 2026-11-09: the 10-stream research firm (engine/swarm_firm.py); "off" pauses it
      OPENER_WAVES: "9:00,10:30,12:00,13:30,15:00,16:30,18:00"   # 7 waves: each sends its share of what is left
    steps:
      - name: Start the clock
        id: clock
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Turned on?
        id: cfg
        run: |
          if [ -n "$SMTP_USER" ] && [ -n "$SMTP_APP_PASSWORD" ] && [ -n "$DESK_KEY" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "The cloud desk is off: add the SMTP_USER, SMTP_APP_PASSWORD and DESK_KEY repository secrets."
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ok == 'true'
      - uses: actions/setup-python@v5
        if: steps.cfg.outputs.ok == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        if: steps.cfg.outputs.ok == 'true'
        run: pip install -q -e .
      - name: Restore the desk's encrypted state
        if: steps.cfg.outputs.ok == 'true'
        uses: actions/cache/restore@v4
        with:
          path: data/cloud
          key: desk-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: desk-state-
      - name: Run the desk
        if: steps.cfg.outputs.ok == 'true'
        env:
          TASK: ${{ github.event.inputs.task || 'run' }}
          REPLY: ${{ github.event.inputs.reply }}
          LEAD: ${{ github.event.inputs.lead }}
          NOTE: ${{ github.event.inputs.note }}
        run: |
          set -- --task "$TASK"
          if [ -n "$REPLY" ]; then set -- "$@" --approve "$REPLY"; fi
          if [ -n "$LEAD" ]; then set -- "$@" --lead "$LEAD"; fi
          if [ -n "$NOTE" ]; then set -- "$@" --note "$NOTE"; fi
          python manage.py cloud --run "$@" 2>/dev/null
      - name: Save the desk's encrypted state
        if: always() && steps.cfg.outputs.ok == 'true' && hashFiles('data/cloud/state.enc') != ''
        uses: actions/cache/save@v4
        with:
          path: data/cloud
          key: desk-state-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Start the next run in a few minutes
        if: always() && steps.cfg.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          STARTED: ${{ steps.clock.outputs.started }}
          CYCLE_SECONDS: "360"
          TASK: ${{ github.event.inputs.task || 'run' }}
        run: |
          # This run never counts itself: GitHub's run list can still show a just-started run as queued (2026-11-10
          # 6:17 PM: run 918 saw "a run is already queued", dispatched nothing, and the chain stopped).
          NOT_ME="map(select(.databaseId != $GITHUB_RUN_ID)) | "
          # GitHub's API sometimes answers a dispatch with a 5xx (2026-11-06 7:38 PM: HTTP 502 broke the chain for the
          # evening). Retry with backoff; a run that got queued anyway counts as done, so nothing is dispatched twice.
          dispatch() {
            wf="$1"; shift
            for w in 0 15 45 90 180; do
              sleep "$w"
              if gh workflow run "$wf" -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" "$@"; then return 0; fi
              sleep 10
              q=$(gh run list -R "$GITHUB_REPOSITORY" --workflow "$wf" --limit 10 --json status,databaseId \
                  --jq "$NOT_ME"'[.[] | select(.status == "queued" or .status == "pending" or .status == "waiting" or .status == "requested")] | length' \
                  2>/dev/null || echo 0)
              if [ "${q:-0}" != "0" ]; then echo "The dispatch errored but the run is queued."; return 0; fi
              echo "Dispatch failed; trying again."
            done
            return 1
          }
          hour=$((10#$(date +%H)))
          # Overnight: night.yml waits on GitHub's side and starts the 5:17 AM refresh; the refresh (or any run before
          # 7 AM) hands the morning start to night.yml again (wake 07:00). GitHub's cron can't be relied on here.
          count_queued() { gh run list -R "$GITHUB_REPOSITORY" --workflow desk.yml --limit 20 --json status,databaseId \
                   --jq "$NOT_ME"'[.[] | select(.status == "queued" or .status == "pending" or .status == "waiting" or .status == "requested")] | length'; }
          if [ "$hour" -ge 21 ]; then
            # First the night's pricing run (new listings from the harvest, up to 70 minutes), then night.yml for
            # the 5:17 AM refresh. A queued note or approval is never replaced: it runs first and hands off itself.
            if [ "$(count_queued)" != "0" ]; then echo "A run is queued: it hands off the night."; exit 0; fi
            if [ "$TASK" != "value" ]; then
              dispatch desk.yml -f task=value
              echo "After hours: pricing the new listings first."; exit 0
            fi
            dispatch night.yml -f wake=05:17 -f task=refresh
            echo "After hours: night.yml starts the 5:17 AM refresh."; exit 0
          fi
          if [ "$hour" -lt 7 ]; then
            # A note or approval before 5:17 must not replace the sleeper that starts the morning refresh.
            if [ "$TASK" != "refresh" ] && [ "$(date +%H%M)" -lt 0517 ]; then
              dispatch night.yml -f wake=05:17 -f task=refresh
              echo "Early: night.yml still starts the 5:17 AM refresh."; exit 0
            fi
            dispatch night.yml -f wake=07:00 -f task=run
            echo "Early: night.yml starts the day at 7:00."; exit 0
          fi
          # One queued run at most: a note or approval someone dispatched meanwhile goes first, and carries the chain.
          # It is checked before the wait too, so a queued note starts now instead of ~6 minutes later.
          if [ "$(count_queued)" != "0" ]; then echo "A run is already queued: it continues the chain."; exit 0; fi
          wait=$(( CYCLE_SECONDS - ($(date +%s) - STARTED) ))
          if [ "$wait" -gt 0 ]; then sleep "$wait"; fi
          queued=$(count_queued)
          if [ "$queued" = "0" ]; then
            dispatch desk.yml -f task=run
          else
            echo "A run is already queued: it continues the chain."
          fi
