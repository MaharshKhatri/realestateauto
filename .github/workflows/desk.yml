# The deal desk in the cloud (engine/cloud_desk.py): replies, answers, openers, calendar, nightly backup.
# Runs every 15 minutes on GitHub's servers, so the operator's laptop can be closed. It stays off until the
# repository has three secrets (Settings > Secrets and variables > Actions): SMTP_USER, SMTP_APP_PASSWORD, DESK_KEY.
# The repository is public: the run prints counts only, and the state it keeps between runs is encrypted.
name: Deal desk

# Runs only by dispatch: each run starts the next one a few minutes later (the last step), 7 AM-9 PM Eastern, so the
# inbox is read about every 6 minutes. GitHub's own cron fired only a few times a day (2026-11-04) and, sharing this
# concurrency group, could cancel a queued note; the safety-net cron lives in kicker.yml, which dispatches a run only
# when none is running or queued.
on:
  workflow_dispatch:
    inputs:
      task:
        description: "run | refresh | recalibrate | approve | dismiss | offer | note"
        default: run
      reply:
        description: "with approve / dismiss: the reply #"
        default: ""
      lead:
        description: "with offer: the lead # whose offer e-mail goes out now"
        default: ""
      note:
        description: "with note: a sealed note from a Claude chat (ciphertext only)"
        default: ""

permissions:
  contents: read
  actions: write                # the last step dispatches the next run (workflow_dispatch works with GITHUB_TOKEN)

concurrency:
  group: deal-desk              # one run at a time: they share one database
  cancel-in-progress: false

jobs:
  desk:
    if: github.repository == 'MaharshKhatri/realestateauto'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
      DESK_KEY: ${{ secrets.DESK_KEY }}
      TZ: America/New_York
      DAILY_OPENERS: "30"          # new cold openers per weekday, split across the waves below (cap: outreach.daily_email_limit)
      OPENER_WAVES: "10:30,14:00"
    steps:
      - name: Start the clock
        id: clock
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Turned on?
        id: cfg
        run: |
          if [ -n "$SMTP_USER" ] && [ -n "$SMTP_APP_PASSWORD" ] && [ -n "$DESK_KEY" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "The cloud desk is off: add the SMTP_USER, SMTP_APP_PASSWORD and DESK_KEY repository secrets."
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ok == 'true'
      - uses: actions/setup-python@v5
        if: steps.cfg.outputs.ok == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        if: steps.cfg.outputs.ok == 'true'
        run: pip install -q -e .
      - name: Restore the desk's encrypted state
        if: steps.cfg.outputs.ok == 'true'
        uses: actions/cache/restore@v4
        with:
          path: data/cloud
          key: desk-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: desk-state-
      - name: Run the desk
        if: steps.cfg.outputs.ok == 'true'
        env:
          TASK: ${{ github.event.inputs.task || 'run' }}
          REPLY: ${{ github.event.inputs.reply }}
          LEAD: ${{ github.event.inputs.lead }}
          NOTE: ${{ github.event.inputs.note }}
        run: |
          set -- --task "$TASK"
          if [ -n "$REPLY" ]; then set -- "$@" --approve "$REPLY"; fi
          if [ -n "$LEAD" ]; then set -- "$@" --lead "$LEAD"; fi
          if [ -n "$NOTE" ]; then set -- "$@" --note "$NOTE"; fi
          python manage.py cloud --run "$@" 2>/dev/null
      - name: Save the desk's encrypted state
        if: always() && steps.cfg.outputs.ok == 'true' && hashFiles('data/cloud/state.enc') != ''
        uses: actions/cache/save@v4
        with:
          path: data/cloud
          key: desk-state-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Start the next run in a few minutes
        if: always() && steps.cfg.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          STARTED: ${{ steps.clock.outputs.started }}
          CYCLE_SECONDS: "360"
        run: |
          hour=$((10#$(date +%H)))
          if [ "$hour" -lt 7 ] || [ "$hour" -ge 21 ]; then echo "After hours: the next run starts tomorrow."; exit 0; fi
          wait=$(( CYCLE_SECONDS - ($(date +%s) - STARTED) ))
          if [ "$wait" -gt 0 ]; then sleep "$wait"; fi
          # One queued run at most: a note or approval someone dispatched meanwhile goes first, and carries the chain.
          queued=$(gh run list -R "$GITHUB_REPOSITORY" --workflow desk.yml --limit 20 --json status \
                   --jq '[.[] | select(.status == "queued" or .status == "pending" or .status == "waiting" or .status == "requested")] | length')
          if [ "$queued" = "0" ]; then
            gh workflow run desk.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f task=run
          else
            echo "A run is already queued: it continues the chain."
          fi
