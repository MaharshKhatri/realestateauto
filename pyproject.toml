[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nj-wholesale-engine"
version = "0.1.0"
description = "Autonomous NJ real estate wholesaling data, underwriting and lead-ranking engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "sqlalchemy>=2.0",
  "pydantic>=2.6",
  "jinja2>=3.1",
  "pyyaml>=6.0",
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "apscheduler>=3.10,<4",
  "python-multipart>=0.0.9",
  "markdown>=3.5",
  "reportlab>=4.0",
  "typer>=0.12",
  "rich>=13.7",
  "openpyxl>=3.1",                 # tax collectors reply to OPRA requests with Excel lists
]

[project.optional-dependencies]
ai = ["anthropic>=2.3"]
browser = ["playwright>=1.44"]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
wholesale = "manage:main"

[tool.setuptools.packages.find]
include = ["core*", "db*", "agents*", "engine*", "swarm*"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
